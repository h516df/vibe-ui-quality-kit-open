name: Reusable workflow checks
on:
  pull_request:
    paths: ['workflow/**', '.ai-workflow.json', '.github/workflows/workflow-kit.yml']
  push:
    branches: [main]
    paths: ['workflow/**', '.ai-workflow.json', '.github/workflows/workflow-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reusable-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Run every toolkit test in two independent groups
        run: python3 workflow/scripts/workflow.py check --level core --jobs 2
