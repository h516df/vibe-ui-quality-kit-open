<!doctype html>
<html lang="zh-CN" data-design="calm" data-mode="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>界面基础样例 · 阅读清单</title>
<link rel="stylesheet" href="ui-foundation.css">
<body class="vibe-demo">
<header class="topbar">
  <div class="wordmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4h6l3 2 3-2h6v15h-6l-3 2-3-2H3zM12 6v15"/></svg>阅读清单</div>
  <div class="options">
    <label>方向 <select id="design"><option value="calm">精致内容</option><option value="utility">清爽工具</option></select></label>
    <label>外观 <select id="mode"><option value="light">浅色</option><option value="dark">深色</option></select></label>
  </div>
</header>
<main>
  <p class="eyebrow">留一点时间，给喜欢的事</p>
  <h1>值得慢慢读的内容</h1>
  <p class="intro">把偶然遇见的好内容留在这里，下一次打开，接着读。</p>
  <div class="toolbar">
    <div class="filters" role="group" aria-label="阅读状态">
      <button type="button" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" data-filter="unread" aria-pressed="false">未读</button>
      <button type="button" data-filter="read" aria-pressed="false">已读</button>
    </div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" type="search" aria-label="搜索清单" placeholder="搜索标题或摘要"></label>
  </div>
  <section class="library" aria-label="阅读内容">
    <article class="entry" data-status="unread">
      <button class="entry-open" type="button" aria-haspopup="dialog">
        <div class="cover sand"><svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M40 135h160M70 135V48h75v87M145 78h35v57M81 60h20v31H81zM114 60h20v31h-20zM81 105h20v30M114 105h20v30M180 110h18v25"/><circle cx="184" cy="43" r="14"/><path d="M28 135V94m-11 12 11-20 11 20M28 115l-12-4m12 14 14-8"/></svg></div>
        <div class="entry-body"><div class="meta"><span>生活观察</span><span>未读 · 6 分钟</span></div><h2>城市里的安静角落</h2><p class="summary">走慢一点，重新发现每天经过的街道。</p></div>
      </button>
    </article>
    <article class="entry" data-status="unread">
      <button class="entry-open" type="button" aria-haspopup="dialog">
        <div class="cover sage"><svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M33 133h175M50 25h135v108H50zM55 30h125v64H55zM117 30v64M55 63h125M75 111h92M85 111v22m72-22v22M190 133V91m-9 0h19l-4 17h-11z"/><path d="m164 31-38 63m54-50-30 50" opacity=".5"/></svg></div>
        <div class="entry-body"><div class="meta"><span>空间与设计</span><span>未读 · 8 分钟</span></div><h2>一间小工作室的光线</h2><p class="summary">不靠添置更多，让空间变得更舒服。</p></div>
      </button>
    </article>
    <article class="entry" data-status="read">
      <button class="entry-open" type="button" aria-haspopup="dialog">
        <div class="cover slate"><svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M36 59h167M36 116h167M49 59v77m141-77v77M64 59V27h13v32m7 0V23h13v36m7 0V34h13v25M137 59V35h37v24M62 116V89h45v27m32 0V78h26v38m8 0V88h13v28"/><path d="M145 35v24m6-24v24M69 97h31m42-13h20"/></svg></div>
        <div class="entry-body"><div class="meta"><span>日常整理</span><span>已读 · 5 分钟</span></div><h2>把常用物品放回顺手的位置</h2><p class="summary">一套容易坚持的秩序，从一次顺手开始。</p></div>
      </button>
    </article>
  </section>
  <p id="empty" class="empty" hidden>没有找到对应内容。试试其他关键词，或切回“全部”。</p>
  <p id="result-status" role="status" aria-live="polite">共 3 篇内容</p>
  <footer>离线界面参考 · 所有内容与插图均为合成样例。搜索、筛选、详情可操作；不保存个人数据。</footer>
</main>
<dialog id="detail" aria-labelledby="detail-title"><h2 id="detail-title"></h2><p id="detail-description"></p><p>这是用于检查中文排版、导航与返回的样例详情。实际产品应接入自己的内容和功能。</p><form method="dialog"><button>返回清单</button></form></dialog>
<script>
const root = document.documentElement;
const entries = [...document.querySelectorAll('.entry')];
let active = 'all';
function filter() {
  const query = document.querySelector('#search').value.trim().toLocaleLowerCase();
  let count = 0;
  for (const entry of entries) {
    entry.hidden = !((active === 'all' || entry.dataset.status === active) && entry.textContent.toLocaleLowerCase().includes(query));
    if (!entry.hidden) count++;
  }
  document.querySelector('#empty').hidden = count !== 0;
  document.querySelector('#result-status').textContent = `共 ${count} 篇内容`;
}
document.querySelector('#search').addEventListener('input', filter);
document.querySelector('#design').addEventListener('change', e => root.dataset.design = e.target.value);
document.querySelector('#mode').addEventListener('change', e => root.dataset.mode = e.target.value);
for (const button of document.querySelectorAll('[data-filter]')) button.addEventListener('click', () => {
  active = button.dataset.filter;
  for (const other of document.querySelectorAll('[data-filter]')) other.setAttribute('aria-pressed', String(other === button));
  filter();
});
for (const entry of entries) entry.querySelector('.entry-open').addEventListener('click', () => {
  document.querySelector('#detail-title').textContent = entry.querySelector('h2').textContent;
  document.querySelector('#detail-description').textContent = entry.querySelector('.summary').textContent;
  document.querySelector('#detail').showModal();
});
</script>
</body></html>
